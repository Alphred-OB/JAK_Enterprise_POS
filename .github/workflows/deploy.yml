# Triggering Debug Deployment: 2026-05-11 15:16
name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy JAK_Enterprise_POS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "${{ secrets.HOST }}"
          username: "${{ secrets.SSH_USER }}"
          key: "${{ secrets.SSH_KEY }}"
          port: "${{ secrets.PORT }}"
          passphrase: "${{ secrets.SSH_PASSPHRASE }}"
          script_stop: true
          script: |
            # --- DEBUG DEPLOYMENT SCRIPT (POSIX COMPLIANT) ---
            set -e

            # Helper for logging
            log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }

            log "🚀 [START] Beginning production deployment..."

            # --- PRE-FLIGHT ENVIRONMENT CHECK ---
            log "[DEBUG] Current Directory: $(pwd)"
            log "[DEBUG] Directory Listing:"
            ls -la

            log "[DEBUG] Checking System Dependencies..."
            php -v | head -n 1 || log "⚠️ Warning: php command not found"
            git --version || log "⚠️ Warning: git command not found"
            composer --version --no-ansi | head -n 1 || log "⚠️ Warning: composer command not found"
            node -v || log "⚠️ Warning: node command not found"
            npm -v || log "⚠️ Warning: npm command not found"

            # --- STEP 1: SAFETY VALIDATIONS ---
            log "[STEP 1] Validating deployment path..."
            
            if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
              log "❌ ERROR: DEPLOY_PATH secret is empty."
              exit 1
            fi

            DEPLOY_TARGET="${{ secrets.DEPLOY_PATH }}"
            log "[DEBUG] Target path: $DEPLOY_TARGET"

            if [ ! -d "$DEPLOY_TARGET" ]; then
              log "❌ ERROR: Target directory $DEPLOY_TARGET does not exist."
              exit 1
            fi

            cd "$DEPLOY_TARGET"
            CURRENT_DIR="$(pwd)"
            log "[DEBUG] Successfully moved to: $CURRENT_DIR"

            if [ "$CURRENT_DIR" = "/" ] || [ "$CURRENT_DIR" = "/home" ] || [ "$CURRENT_DIR" = "/root" ]; then
              log "❌ CRITICAL SAFETY ERROR: Attempted deployment to protected directory: $CURRENT_DIR"
              exit 1
            fi

            # --- STEP 2: ENVIRONMENT PROTECTION ---
            log "[STEP 2] Protecting environment files..."
            if [ -f ".env" ]; then
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              log "[DEBUG] Backing up .env to .env.backup.$TIMESTAMP"
              cp .env ".env.backup.$TIMESTAMP"
            else
              log "[DEBUG] No existing .env file found to backup."
            fi

            # --- STEP 3: REPOSITORY SYNC ---
            log "[STEP 3] Synchronizing repository code..."
            
            if [ ! -d ".git" ]; then
              log "[DEBUG] No .git found. Initializing new repository..."
              git init
              git remote add origin https://github.com/Alphred-OB/JAK_Enterprise_POS.git
              log "[DEBUG] Fetching from origin..."
              git fetch origin main
              log "[DEBUG] Checking out main branch..."
              git checkout -t origin/main -f
            else
              log "[DEBUG] .git found. Syncing with latest code..."
              git fetch origin main
              git reset --hard origin/main
            fi
            log "✅ Repository sync complete."

            # --- STEP 4: PRODUCTION BUILD ---
            log "[STEP 4] Installing dependencies and building assets..."

            if command -v composer >/dev/null 2>&1; then
                log "[DEBUG] Running 'composer install'..."
                composer install --no-dev --optimize-autoloader --no-interaction
            else
                log "⚠️ Skipping 'composer install' (command not found)"
            fi

            if command -v npm >/dev/null 2>&1; then
                log "[DEBUG] Running 'npm install'..."
                npm install
                log "[DEBUG] Running 'npm run build'..."
                npm run build
            else
                log "⚠️ Skipping 'npm build' (npm command not found)"
            fi

            # --- STEP 5: APPLICATION OPTIMIZATION ---
            log "[STEP 5] Finalizing application state..."

            log "[DEBUG] Running database migrations..."
            php artisan migrate --force

            log "[DEBUG] Optimizing Laravel caches..."
            php artisan optimize
            php artisan view:cache
            php artisan event:cache

            log "✅ [SUCCESS] Deployment finished successfully."
